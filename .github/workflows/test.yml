name: Test

# Remote verification of this repo's public contract: SwiftUIHost builds from
# a fresh clone with native tools only, resolving swift-tui through its public
# tagged HTTPS dependency, and its test suite passes. This runs the same
# command as the org root's //:swift_tui_swiftui_native_gate (swiftly-managed
# `swift test`), so a red here means the org gate would be red too.
#
# Lane shape (swift-tui-org plan 2026-08-25-001 Stage 4): SwiftUIHost is
# Apple-only (it imports SwiftUI/AppKit/UIKit), so nothing here can run on
# Linux, and the plan's first principle is that the per-push hot path runs
# only what Linux can run. The macOS suite therefore runs:
#   * nightly, guarded by lane-verdict-probe so it exits in under a minute
#     when nothing has landed since its last green run;
#   * on every tag push (`*.*.*`) — required for a release;
#   * on workflow_dispatch, on demand.
# There is deliberately no push / pull_request job.

on:
  push:
    tags: ["*.*.*"]
  schedule:
    - cron: "53 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiftui-test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip-if-unchanged guard (plan 2026-08-25-001 §6). On a schedule, a green
  # verdict already recorded for this exact commit means the run ends here.
  # Dispatch and tag pushes always run.
  changes:
    name: Skip macOS lane if unchanged
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
      key: ${{ steps.probe.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Probe the lane verdict
        id: probe
        uses: ./.github/actions/lane-verdict-probe
        with:
          lane: swiftui-macos

  macos-host:
    name: SwiftUIHost tests (macOS)
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Swiftly toolchain
        uses: actions/cache@v6
        with:
          # ~/.swiftly holds swiftly's registry, but macOS toolchains install
          # to ~/Library/Developer/Toolchains — caching only the registry
          # makes every cache-hit run fail with "already installed" while the
          # toolchain directory is absent. Cache both, keyed together.
          path: |
            ~/.swiftly
            ~/Library/Developer/Toolchains
          key: ${{ runner.os }}-swiftly-toolchain-${{ hashFiles('.swift-version') }}
          restore-keys: |
            ${{ runner.os }}-swiftly-toolchain-

      - name: Install swiftly and Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$HOME/.swiftly/env.sh" ]; then
            curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg
            installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
            "$HOME/.swiftly/bin/swiftly" init --skip-install --quiet-shell-followup --assume-yes
          fi
          . "$HOME/.swiftly/env.sh"
          hash -r
          swift_version="$(tr -d '[:space:]' < .swift-version)"
          swiftly install --use --assume-yes "$swift_version"
          swiftly run swift --version
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$HOME/.swiftly" >> "$GITHUB_ENV"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Run native gate
        shell: bash
        run: Scripts/native_gate.sh

  record-macos-verdict:
    name: Record macOS lane verdict
    needs: [changes, macos-host]
    if: needs.changes.outputs.changed == 'true' && needs.macos-host.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Record the green verdict
        uses: ./.github/actions/lane-verdict-record
        with:
          key: ${{ needs.changes.outputs.key }}
